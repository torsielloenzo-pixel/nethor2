name: Nethor 2 - Tests unitaires
on:
  push:
    branches: [main, feature/nethor-sync-2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe et les tests
        run: npm run check
