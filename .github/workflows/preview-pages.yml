name: Nethor 2 - Publication PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nethor2-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4
      - name: Préparer les ressources publiques de la PWA Nethor 2
        run: |
          mkdir -p _site/assets _site/src/ui _site/src/import _site/src/domain _site/src/auth _site/src/data _site/src/config
          cp index.html reset-password.html styles.css live.css mobile.css staff-desktop.css sw.js manifest.webmanifest CNAME _site/
          cp assets/icon.svg _site/assets/
          cp src/ui/live.js src/ui/team-access.js src/ui/planning-mobile.js src/ui/layout-role.js src/ui/settings-security.js src/ui/recovery-prompt.js src/ui/nethor-sync-overview.js _site/src/ui/
          cp src/import/import-preview.js src/import/excel-structure.js _site/src/import/
          cp src/domain/planning-core.js src/domain/employee-linker.js src/domain/personal-overview.js _site/src/domain/
          cp src/auth/session-gate.js src/auth/login-identifier.js src/auth/account-security.js src/auth/password-recovery-page.js _site/src/auth/
          cp src/data/planning-repository.js src/data/nethor-sync-control.js _site/src/data/
          cp src/config/public.js _site/src/config/
          python3 -m pip install --disable-pip-version-check --quiet 'CairoSVG==2.8.2' 'Pillow==11.3.0'
          python3 scripts/generate-pwa-icons.py _site/assets
          test -s _site/assets/nethor-logo-180-v8.png && test -s _site/assets/nethor-logo-192-v8.png && test -s _site/assets/nethor-logo-512-v8.png && test -s _site/favicon.ico
          test "$(cat _site/CNAME)" = "nethor.fr"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = ['Installer-Sync.ps1', 'Connect-NethorSync.ps1', 'NethorSync.ps1', 'config.example.json', 'README.md']
          with ZipFile('_site/nethor-sync-2.zip', 'w', ZIP_DEFLATED) as archive:
              for name in files:
                  path = Path('tools/nethor-sync') / name
                  if not path.is_file():
                      raise SystemExit(f'Fichier absent dans le programme NethorSync : {name}')
                  archive.write(path, arcname=name)
          PY
          test -s _site/nethor-sync-2.zip
          test -s _site/reset-password.html && test -s _site/src/auth/password-recovery-page.js
          test ! -e _site/.env
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Envoyer l'aperçu
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier l'aperçu
        id: deployment
        uses: actions/deploy-pages@v4
