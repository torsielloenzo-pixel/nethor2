name: Nethor 2 - Publication PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nethor2-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4
      - name: Vérifier la syntaxe et les tests
        run: npm run check
      - name: Préparer les ressources publiques de la PWA Nethor 2
        run: |
          mkdir -p _site/assets
          cp index.html reset-password.html styles.css live.css mobile.css mobile-sync-simple.css staff-desktop.css nethor-sync.css nethor-sync-import-guide.css nethor-account-ui.css nethor-dashboard.css nethor-history-browser.css nethor-flow.css nethor-flow.js sw.js manifest.webmanifest CNAME _site/
          cp assets/icon.svg _site/assets/
          cp -R src _site/
          python3 -m pip install --disable-pip-version-check --quiet 'CairoSVG==2.8.2' 'Pillow==11.3.0'
          python3 scripts/generate-pwa-icons.py _site/assets
          test -s _site/assets/nethor-logo-180-v8.png && test -s _site/assets/nethor-logo-192-v8.png && test -s _site/assets/nethor-logo-512-v8.png && test -s _site/favicon.ico
          test "$(cat _site/CNAME)" = "nethor.fr"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = ['Installer-Sync.ps1', 'Connect-NethorSync.ps1', 'NethorSync.ps1', 'config.example.json', 'README.md']
          with ZipFile('_site/nethor-sync-2.zip', 'w', ZIP_DEFLATED) as archive:
              for name in files:
                  path = Path('tools/nethor-sync') / name
                  if not path.is_file():
                      raise SystemExit(f'Fichier absent dans le programme NethorSync : {name}')
                  archive.write(path, arcname=name)
          PY
          python3 - <<'PYREC'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('_site/NethorSync-Correctif-Demarrage.zip','w',ZIP_DEFLATED) as archive:
              for name in ('Repair-NethorSync-Startup.ps1','NethorSyncRunner.vbs','Register-NethorSyncTasks.ps1'):
                  source=Path('tools/nethor-sync') / name
                  if not source.is_file(): raise SystemExit(f'Correctif manquant : {name}')
                  archive.write(source,arcname=name)
          PYREC
          test -s _site/NethorSync-Correctif-Demarrage.zip
          test -s _site/nethor-sync-2.zip
          test -s _site/reset-password.html && test -s _site/src/auth/password-recovery-page.js
          python3 scripts/verify-pwa-shell.py _site sw.js
          test ! -e _site/.env
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Envoyer l'aperçu
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier l'aperçu
        id: deployment
        uses: actions/deploy-pages@v4
