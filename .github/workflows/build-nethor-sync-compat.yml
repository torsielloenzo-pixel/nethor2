name: NethorSync - Installateur compatible 2.1.8

# Un seul déploiement volontaire du correctif compatible 2.1.8.
# Conserve la base Windows 2.1.1, sans écoute permanente.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nethor-sync-compat.yml'
      - 'tools/nethor-sync/NethorSync.ps1'
      - 'tools/nethor-sync/Update-NethorSync.ps1'
      - 'tools/nethor-sync/NethorSyncRunner.vbs'
      - 'tools/nethor-sync/Register-NethorSyncTasks-217.ps1'
      - 'tools/nethor-sync/NethorSync2-218.iss'
      - 'tools/nethor-sync/NethorSync-Version.txt'

permissions:
  contents: write

concurrency:
  group: nethor-sync-compat-baseline
  cancel-in-progress: true

jobs:
  build-baseline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Recuperer la version 2.1.1 qui fonctionnait avant la refonte
        uses: actions/checkout@v4
        with:
          ref: 55b1d728aa770d2e4bd875f62521c7a6271fbcd4
          persist-credentials: false
      - name: Verifier le code source fixe
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne '55b1d728aa770d2e4bd875f62521c7a6271fbcd4') {
            throw "Version source non conforme"
          }
          $iss=Get-Content -LiteralPath 'tools\nethor-sync\NethorSync2.iss' -Raw
          if ($iss -notmatch '#define AppVersion "2\.1\.1"') { throw 'Version Inno Setup incorrecte' }
          if ($iss -match 'Watch-NethorSync.ps1') { throw 'La version de reference ne doit pas contenir le processus d ecoute' }
          Write-Host 'Source connue : version 2.1.1, sans écoute continue.'
      - name: Recuperer les corrections de scripts de cette revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: bugfix
          persist-credentials: false
      - name: Appliquer le correctif aux scripts de la version compatible
        shell: pwsh
        run: |
          foreach ($name in @('NethorSync.ps1','Connect-NethorSync.ps1','Verify-NethorSyncBinding.ps1')) {
            $source = Join-Path 'bugfix/tools/nethor-sync' $name
            $target = Join-Path 'tools/nethor-sync' $name
            if (-not (Test-Path $source)) { throw "Correctif absent : $name" }
            Copy-Item -LiteralPath $source -Destination $target -Force
            $content = Get-Content -LiteralPath $target -Raw
            if ($content -match '\$ConfigPath\s*=\s*\(Join-Path') { throw "Ancien chemin de paramètre détecté : $name" }
          }
          # Composants 2.1.8, sans importer le listener permanent 2.2.0.
          $addons=@{
            'Update-NethorSync.ps1'='Update-NethorSync.ps1'
            'NethorSync-Version.txt'='NethorSync-Version.txt'
            'NethorSyncRunner.vbs'='NethorSyncRunner.vbs'
            'Register-NethorSyncTasks-217.ps1'='Register-NethorSyncTasks.ps1'
            'NethorSync2-218.iss'='NethorSync2.iss'
          }
          foreach($entry in $addons.GetEnumerator()) {
            Copy-Item -LiteralPath (Join-Path 'bugfix/tools/nethor-sync' $entry.Key) -Destination (Join-Path 'tools/nethor-sync' $entry.Value) -Force
          }
          if ((Get-Content 'tools/nethor-sync/NethorSync-Version.txt' -Raw).Trim() -ne '2.1.8') { throw 'Marqueur version invalide' }
          $updateSource=Get-Content -LiteralPath 'tools/nethor-sync/Update-NethorSync.ps1' -Raw
          if ($updateSource -notmatch 'hash_mismatch' -or $updateSource -notmatch 'nethor_sync_update_manifest' -or
              $updateSource -notmatch 'rolled_back') { throw 'Updater incomplet' }
          foreach ($name in @('NethorSync.ps1','Update-NethorSync.ps1','Register-NethorSyncTasks.ps1')) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ('tools/nethor-sync/'+$name)),[ref]$tokens,[ref]$parseErrors)|Out-Null
            if ($parseErrors.Count -gt 0) { throw ('Erreur PowerShell '+$name+': '+$parseErrors[0].Message) }
          }
          $scan=Get-Content -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Raw
          if ($scan -notmatch 'nethor_sync_record_file_changes') { throw 'Agent sans transmission des versions de fichiers' }
          if ($scan -notmatch 'previousModifiedUtc') { throw 'Historique des dates de versions manquant' }
          if ($scan -notmatch 'nethor_sync_staged_exists') { throw 'Correctif des doublons Supabase absent' }
          if ($scan -notmatch 'already_staged') { throw 'Reprise de doublons absente' }
          if ($scan -notmatch 'nethor_sync_submit_diagnostic') { throw 'Telemetrie des erreurs Windows absente' }
          if ($scan -notmatch 'Submit-FileHistoryBatch' -or $scan -notmatch 'history_error') {
            throw 'Reprise partielle de l historique non presente'
          }
          $issPath='tools/nethor-sync/NethorSync2.iss'
          $iss=Get-Content -LiteralPath $issPath -Raw
          # Source Inno 2.1.8 deja preparee depuis le depot
          if ($iss -notmatch '#define AppVersion "2\.1\.8"') { throw 'Version du correctif invalide' }
          if ($iss -notmatch 'IsAutoUpdate' -or $iss -notmatch 'Update-NethorSync.ps1') { throw 'Mise a jour silencieuse indisponible' }
          Set-Content -LiteralPath $issPath -Value $iss -Encoding UTF8
          # Le poste peut provenir de la 2.2.0 : retirer son ancienne tâche
          # d'écoute permanente au profit du contrôle léger toutes les 5 min.
          $tasksPath='tools/nethor-sync/Register-NethorSyncTasks.ps1'
          $tasks=Get-Content -LiteralPath $tasksPath -Raw
          $before="foreach (`$legacy in @('Nethor Sync 2 - Toutes les 3h','Nethor Sync 2 - Ouverture de session'))"
          $after="foreach (`$legacy in @('Nethor Sync 2 - Toutes les 3h','Nethor Sync 2 - Ouverture de session','Nethor Sync 2 - Ecoute'))"
          if (-not $tasks.Contains($before)) { throw 'Tâche legacy introuvable' }
          $tasks=$tasks.Replace($before,$after)
          $tasks=$tasks.Replace('try { $null = $folder.GetTask($legacy); $folder.DeleteTask($legacy,0) }',
            'try { $old=$folder.GetTask($legacy); foreach ($instance in @($old.GetInstances(0))) { $instance.Stop() }; $folder.DeleteTask($legacy,0) }')
          Set-Content -LiteralPath $tasksPath -Value $tasks -Encoding UTF8
          Write-Host 'Version Windows compatible 2.1.8, sans agent permanent.'
      - name: Tester le demarrage reel du scanner et les sous-dossiers
        shell: powershell
        run: |
          $probe=Join-Path $env:TEMP ('nethor-sync-boot-'+[guid]::NewGuid().ToString('N'))
          $agent=Join-Path $probe 'app'
          $plans=Join-Path $probe 'Planning/2026/Octobre'
          $state=Join-Path $probe 'state'
          New-Item -ItemType Directory -Path $agent,$plans -Force | Out-Null
          try {
            Copy-Item -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Destination $agent
            [IO.File]::WriteAllBytes((Join-Path $plans 'planning.xls'),[byte[]](1,2,3,4))
            @{rootPath=(Join-Path $probe 'Planning');statePath=$state;uploadEnabled=$false;maxFileMB=10} |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $agent 'config.json') -Encoding UTF8
            $result=& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $agent 'NethorSync.ps1') -DryRun 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {throw "Erreur au démarrage du scanner : $result"}
            $report=Get-Content -LiteralPath (Join-Path $state 'sync-report.json') -Raw | ConvertFrom-Json
            if ($report.scanned -ne 1) {throw "Scan récursif incorrect : $($report.scanned)"}
            Write-Host 'Démarrage sans -ConfigPath OK ; sous-dossiers détectés.'
          } finally {
            Remove-Item -LiteralPath $probe -Force -Recurse -ErrorAction SilentlyContinue
          }
      - name: Tester les doublons Supabase avant transfert (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $source=Get-Content -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Raw
          $start=$source.IndexOf('function Upload-Candidate(')
          $end=$source.IndexOf('# Une seule instance', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Fonction Upload-Candidate absente' }
          $uploadFunction=$source.Substring($start,$end-$start)
          Invoke-Expression $uploadFunction
          $script:exists=$true
          $script:uploadCalls=0
          function Invoke-SyncRpc { param($Settings,$Token,$Method,$Params)
            if ($Method -ne 'nethor_sync_staged_exists') { throw "Mauvaise RPC : $Method" }
            if ($Params.p_storage_key -notmatch '^sync-inbox/[a-f0-9]{64}-') { throw 'Chemin de stockage incorrect' }
            return $script:exists
          }
          function Invoke-RestMethod { $script:uploadCalls++; throw 'Un doublon ne doit pas etre envoye' }
          $cfg=@{supabaseUrl='https://exemple.supabase.co';publishableKey='test-public'}
          $device=@{id='00000000-0000-4000-8000-000000000001';secret='test';generation=1}
          $file=[pscustomobject]@{Name='Planning 19.10.26 SEMAINE A.xls';Extension='.xls';FullName='C:\planning.xls'}
          $hash='a'*64
          $result=Upload-Candidate $cfg 'jeton-test' $file $hash $device
          if ($result.status -ne 'already_staged') { throw 'Doublon non reconnu' }
          if ($script:uploadCalls -ne 0) { throw 'Fichier existant inutilement re-uploade' }
          $script:exists=$false
          try {
            $null=Upload-Candidate $cfg 'jeton-test' $file $hash $device
            throw 'Nouvel objet : erreur attendue en absence du vrai stockage'
          } catch {
            if ($_.Exception.Message -eq 'Nouvel objet : erreur attendue en absence du vrai stockage') { throw }
          }
          if ($script:uploadCalls -ne 1) { throw 'L envoi d un fichier inexistant est absent' }
          Write-Host 'Pre-verification doublon : OK ; envoi nouveau fichier : OK.'
      - name: Tester le diagnostic sécurisé de 338 erreurs HTTP 400 sous Windows PowerShell
        shell: powershell
        run: |
          $scan=Get-Content -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Raw
          $start=$scan.IndexOf('$script:diagnosticGroups = @{}')
          $end=$scan.IndexOf('function Get-DeviceIdentity(', $start)
          if ($start -lt 0 -or $end -le $start) {throw 'Fonctions de diagnostic introuvables'}
          Invoke-Expression $scan.Substring($start,$end-$start)
          $failure=[pscustomobject]@{Exception=[pscustomobject]@{Response=[pscustomobject]@{StatusCode=400}}}
          for ($i=0; $i -lt 338; $i++) {Add-SafeSyncError $failure 'storage_upload'}
          $script:captured=$null
          function Invoke-SyncRpc {
            param($Settings,$Token,$Method,$Params)
            if ($Method -ne 'nethor_sync_submit_diagnostic') {throw 'RPC incorrecte'}
            $script:captured=$Params
          }
          $device=@{id='00000000-0000-4000-8000-000000000001';secret='test';generation=1}
          Send-SafeSyncDiagnostic @{} 'jeton-fictif' $device 338 338 0
          if (-not $script:captured) {throw 'Rapport jamais transmis'}
          if ($script:captured.p_error_code -ne 'request_rejected') {throw 'Code HTTP 400 mal classe'}
          if ($script:captured.p_http_status -ne 400) {throw 'Code HTTP manquant'}
          if ($script:captured.p_failed -ne 338) {throw 'Nombre de fichiers incorrect'}
          if ($script:captured.p_breakdown[0].count -ne 338) {throw 'Regroupement des 338 erreurs incorrect'}
          $json=$script:captured.p_breakdown | ConvertTo-Json -Depth 6
          if ($json -match 'fileName|relativePath|access_token|Bearer|C:\\Users') {
            throw 'Donnees privees presentes dans le rapport'
          }
          Write-Host 'Diagnostic simule: 338 erreurs HTTP400, aucun chemin ni jeton.'
      - name: Tester l isolation des lots d historique rejetes
        shell: powershell
        run: |
          $scan=Get-Content -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Raw
          $start=$scan.IndexOf('$script:historyRetryBudget = 64')
          $end=$scan.IndexOf('# Une seule instance', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Code reprise historique introuvable' }
          $script:errors=@()
          $script:entries=@(
            [pscustomobject]@{path='ok.xls';sha256=('a'*64);upload='staged'},
            [pscustomobject]@{path='bad.xls';sha256=('b'*64);upload='staged'}
          )
          function Add-SafeSyncError { param($failure,$stage) }
          function Invoke-SyncRpc {
            param($Settings,$Token,$Method,$Params)
            $items=@($Params.p_changes)
            if (@($items | Where-Object { $_.relativePath -eq 'bad.xls' }).Count -gt 0) {
              throw 'NETHOR_SYNC_INVALID_FILE_CHANGE'
            }
            return [pscustomobject]@{ accepted=$true; created=$items.Count }
          }
          Invoke-Expression $scan.Substring($start,$end-$start)
          $items=@(
            @{relativePath='ok.xls';sha256=('a'*64)},
            @{relativePath='bad.xls';sha256=('b'*64)}
          )
          $device=@{id='00000000-0000-4000-8000-000000000001';secret='test';generation=1}
          Submit-FileHistoryBatch @{} 'test' $device $items
          if ($script:errors.Count -ne 1 -or $script:errors[0].file -ne 'bad.xls') {
            throw 'La cause precise du lot rejete n est pas isolee'
          }
          if ($script:entries[0].upload -ne 'staged' -or $script:entries[1].upload -ne 'history_error') {
            throw 'Le fichier valide est bloque ou le fichier invalide n est pas retentable'
          }
          Write-Host 'Historisation partielle et reprise selective OK.'
      - name: Vérifier l encodage UTF-8 réel sous Windows PowerShell 5.1
        shell: powershell
        run: |
          $source=Get-Content -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Raw -Encoding UTF8
          $start=$source.IndexOf('function ConvertTo-SyncUtf8JsonBytes(')
          $end=$source.IndexOf('# Telemetrie privee', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Transport UTF-8 introuvable' }
          Invoke-Expression $source.Substring($start,$end-$start)
          $script:capture=$null
          function Invoke-RestMethod {
            param($Method,$Uri,$Headers,$ContentType,$Body)
            if ($ContentType -ne 'application/json; charset=utf-8') { throw 'Charset absent' }
            if ($Body -isnot [byte[]]) {throw ('Pas de binaire UTF-8: '+$Body.GetType().FullName)}
            $script:capture=[System.Text.UTF8Encoding]::new($false,$true).GetString($Body)
            return [pscustomobject]@{accepted=$true}
          }
          $name='PLANNING ÉTÉ été Août 2026.xls'
          $path='2026\\Août\\'+$name
          $device=@{ p_changes=@(@{fileName=$name;relativePath=$path;kind='added';
            sha256=('a'*64);storageKey=('sync-inbox/'+('a'*64)+'-planning.xls')}) }
          $resp=Invoke-SyncRpc @{supabaseUrl='https://example.supabase.co';publishableKey='test'} 'fake-token' 'nethor_sync_record_file_changes' $device
          if ($resp.accepted -ne $true) {throw 'Envoi non simule'}
          $decoded=$script:capture|ConvertFrom-Json
          if ($decoded.p_changes[0].fileName -cne $name -or $decoded.p_changes[0].relativePath -cne $path) {
             throw 'Les accents ou les sous-dossiers ont ete alteres'
          }
          if ($script:capture -notmatch 'Août' -or $script:capture -notmatch 'ÉTÉ') {throw 'Unicode corrompu'}
          $realVersion=(Get-SyncClientVersion)
          if ($realVersion -ne '2.1.8') { throw ('Version reelle incorrecte: '+$realVersion) }
          Write-Host 'JSON UTF-8 explicite, accents, chemin et numero de version valides.'
      - name: Tester la validation de mise a jour via Supabase
        shell: powershell
        run: |
          $source=Get-Content -LiteralPath 'tools/nethor-sync/Update-NethorSync.ps1' -Raw
          $first=$source.IndexOf('function Parse-Version(')
          $last=$source.IndexOf('function Get-UpdateAuthHeaders(', $first)
          if ($first -lt 0 -or $last -le $first) { throw 'Validation manifeste absente' }
          Invoke-Expression $source.Substring($first,$last-$first)
          $valid=[pscustomobject]@{
            enabled=$true; version='2.1.9'; sha256=('a'*64)
            downloadUrl='https://github.com/torsielloenzo-pixel/nethor2/releases/download/nethor-sync2-latest/NethorSync2-Setup-Compatibility-219.exe'
          }
          if (-not (Validate-UpdateManifest $valid '2.1.8')) { throw 'Version future non retenue' }
          if (Validate-UpdateManifest $valid '2.1.9') { throw 'Downgrade autorise' }
          $valid.downloadUrl='https://example.com/file.exe'
          try { $null=Validate-UpdateManifest $valid '2.1.8'; throw 'URL externe acceptee' }
          catch { if ($_.Exception.Message -eq 'URL externe acceptee') {throw} }
          $valid.downloadUrl='https://github.com/torsielloenzo-pixel/nethor2/releases/download/nethor-sync2-latest/NethorSync2-Setup-Compatibility-219.exe'
          $valid.sha256=('0'*64)
          try { $null=Validate-UpdateManifest $valid '2.1.8'; throw 'Hash nul accepte' }
          catch { if ($_.Exception.Message -eq 'Hash nul accepte') {throw} }
          Write-Host 'Manifeste : comparaison semver, URL versionnee, hash SHA256 OK'
      - name: Installer Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) {throw "Inno Setup indisponible"}
      - name: Compiler la version compatible avec correctif des chemins PowerShell
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {$compiler="$env:ProgramFiles\Inno Setup 6\ISCC.exe"}
          if (-not (Test-Path $compiler)) {throw 'Compilateur absent'}
          & $compiler 'tools\nethor-sync\NethorSync2.iss'
          if ($LASTEXITCODE -ne 0) {throw 'Compilation échouée'}
          $original='build\installer\NethorSync2-Setup.exe'
          $result='build\installer\NethorSync2-Setup-Compatibility-218.exe'
          if (-not (Test-Path $original)) {throw 'Exécutable absent'}
          Copy-Item $original $result -Force
          $publicName='build\installer\NethorSync-Setup.exe'
          Copy-Item $result $publicName -Force
          $hashCompat=(Get-FileHash -Algorithm SHA256 $result).Hash
          $hashPublic=(Get-FileHash -Algorithm SHA256 $publicName).Hash
          if ($hashCompat -ne $hashPublic) { throw 'La version publique diffère de la version validée' }
          Get-FileHash -Algorithm SHA256 $publicName | Format-List
      - name: Test présence du fichier EXE
        shell: pwsh
        run: |
          $file=Get-Item 'build\installer\NethorSync2-Setup-Compatibility-218.exe'
          if ($file.Length -lt 100000) { throw 'Taille de fichier incohérente' }
      - name: Joindre l exécutable à GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NethorSync2-Compatibility-218
          path: |
            build/installer/NethorSync2-Setup-Compatibility-218.exe
            build/installer/NethorSync-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Joindre la variante à la release NethorSync existante
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag='nethor-sync2-latest'
          $exe='build/installer/NethorSync2-Setup-Compatibility-218.exe'
          $public='build/installer/NethorSync-Setup.exe'
          gh release view $tag --repo $env:GH_REPO --json tagName
          if ($LASTEXITCODE -ne 0) {throw 'Release NethorSync existante introuvable'}
          gh release upload $tag $exe $public --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) {throw 'Impossible de publier le téléchargement NethorSync'}
          gh release view $tag --repo $env:GH_REPO --json assets --jq '.assets[] | select(.name=="NethorSync2-Setup-Compatibility-218.exe" or .name=="NethorSync-Setup.exe") | .name'
