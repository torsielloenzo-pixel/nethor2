name: NethorSync - Installateur compatible MSI

# Un seul déploiement volontaire du correctif compatible 2.1.4.
# Conserve la base Windows 2.1.1, sans écoute permanente.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nethor-sync-compat.yml'

permissions:
  contents: write

concurrency:
  group: nethor-sync-compat-baseline
  cancel-in-progress: true

jobs:
  build-baseline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Recuperer la version 2.1.1 qui fonctionnait avant la refonte
        uses: actions/checkout@v4
        with:
          ref: 55b1d728aa770d2e4bd875f62521c7a6271fbcd4
          persist-credentials: false
      - name: Verifier le code source fixe
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne '55b1d728aa770d2e4bd875f62521c7a6271fbcd4') {
            throw "Version source non conforme"
          }
          $iss=Get-Content -LiteralPath 'tools\nethor-sync\NethorSync2.iss' -Raw
          if ($iss -notmatch '#define AppVersion "2\.1\.1"') { throw 'Version Inno Setup incorrecte' }
          if ($iss -match 'Watch-NethorSync.ps1') { throw 'La version de reference ne doit pas contenir le processus d ecoute' }
          Write-Host 'Source connue : version 2.1.1, sans écoute continue.'
      - name: Recuperer les corrections de scripts de cette revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: bugfix
          persist-credentials: false
      - name: Appliquer le correctif aux scripts de la version compatible
        shell: pwsh
        run: |
          foreach ($name in @('NethorSync.ps1','Connect-NethorSync.ps1','Verify-NethorSyncBinding.ps1')) {
            $source = Join-Path 'bugfix/tools/nethor-sync' $name
            $target = Join-Path 'tools/nethor-sync' $name
            if (-not (Test-Path $source)) { throw "Correctif absent : $name" }
            Copy-Item -LiteralPath $source -Destination $target -Force
            $content = Get-Content -LiteralPath $target -Raw
            if ($content -match '\$ConfigPath\s*=\s*\(Join-Path') { throw "Ancien chemin de paramètre détecté : $name" }
          }
          $scan=Get-Content -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Raw
          if ($scan -notmatch 'nethor_sync_record_file_changes') { throw 'Agent sans transmission des versions de fichiers' }
          if ($scan -notmatch 'previousModifiedUtc') { throw 'Historique des dates de versions manquant' }
          if ($scan -notmatch 'nethor_sync_staged_exists') { throw 'Correctif des doublons Supabase absent' }
          if ($scan -notmatch 'already_staged') { throw 'Reprise de doublons absente' }
          $issPath='tools/nethor-sync/NethorSync2.iss'
          $iss=Get-Content -LiteralPath $issPath -Raw
          $iss=$iss.Replace('#define AppVersion "2.1.1"','#define AppVersion "2.1.4"')
          if ($iss -notmatch '#define AppVersion "2\.1\.3"') { throw 'Version du correctif invalide' }
          Set-Content -LiteralPath $issPath -Value $iss -Encoding UTF8
          # Le poste peut provenir de la 2.2.0 : retirer son ancienne tâche
          # d'écoute permanente au profit du contrôle léger toutes les 5 min.
          $tasksPath='tools/nethor-sync/Register-NethorSyncTasks.ps1'
          $tasks=Get-Content -LiteralPath $tasksPath -Raw
          $before="foreach (`$legacy in @('Nethor Sync 2 - Toutes les 3h','Nethor Sync 2 - Ouverture de session'))"
          $after="foreach (`$legacy in @('Nethor Sync 2 - Toutes les 3h','Nethor Sync 2 - Ouverture de session','Nethor Sync 2 - Ecoute'))"
          if (-not $tasks.Contains($before)) { throw 'Tâche legacy introuvable' }
          $tasks=$tasks.Replace($before,$after)
          $tasks=$tasks.Replace('try { $null = $folder.GetTask($legacy); $folder.DeleteTask($legacy,0) }',
            'try { $old=$folder.GetTask($legacy); foreach ($instance in @($old.GetInstances(0))) { $instance.Stop() }; $folder.DeleteTask($legacy,0) }')
          Set-Content -LiteralPath $tasksPath -Value $tasks -Encoding UTF8
          Write-Host 'Version Windows compatible 2.1.4, sans agent permanent.'
      - name: Tester le demarrage reel du scanner et les sous-dossiers
        shell: powershell
        run: |
          $probe=Join-Path $env:TEMP ('nethor-sync-boot-'+[guid]::NewGuid().ToString('N'))
          $agent=Join-Path $probe 'app'
          $plans=Join-Path $probe 'Planning/2026/Octobre'
          $state=Join-Path $probe 'state'
          New-Item -ItemType Directory -Path $agent,$plans -Force | Out-Null
          try {
            Copy-Item -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Destination $agent
            [IO.File]::WriteAllBytes((Join-Path $plans 'planning.xls'),[byte[]](1,2,3,4))
            @{rootPath=(Join-Path $probe 'Planning');statePath=$state;uploadEnabled=$false;maxFileMB=10} |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $agent 'config.json') -Encoding UTF8
            $result=& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $agent 'NethorSync.ps1') -DryRun 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {throw "Erreur au démarrage du scanner : $result"}
            $report=Get-Content -LiteralPath (Join-Path $state 'sync-report.json') -Raw | ConvertFrom-Json
            if ($report.scanned -ne 1) {throw "Scan récursif incorrect : $($report.scanned)"}
            Write-Host 'Démarrage sans -ConfigPath OK ; sous-dossiers détectés.'
          } finally {
            Remove-Item -LiteralPath $probe -Force -Recurse -ErrorAction SilentlyContinue
          }
      - name: Tester les doublons Supabase avant transfert (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $source=Get-Content -LiteralPath 'tools/nethor-sync/NethorSync.ps1' -Raw
          $start=$source.IndexOf('function Upload-Candidate(')
          $end=$source.IndexOf('# Une seule instance', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Fonction Upload-Candidate absente' }
          $uploadFunction=$source.Substring($start,$end-$start)
          Invoke-Expression $uploadFunction
          $script:exists=$true
          $script:uploadCalls=0
          function Invoke-SyncRpc { param($Settings,$Token,$Method,$Params)
            if ($Method -ne 'nethor_sync_staged_exists') { throw "Mauvaise RPC : $Method" }
            if ($Params.p_storage_key -notmatch '^sync-inbox/[a-f0-9]{64}-') { throw 'Chemin de stockage incorrect' }
            return $script:exists
          }
          function Invoke-RestMethod { $script:uploadCalls++; throw 'Un doublon ne doit pas etre envoye' }
          $cfg=@{supabaseUrl='https://exemple.supabase.co';publishableKey='test-public'}
          $device=@{id='00000000-0000-4000-8000-000000000001';secret='test';generation=1}
          $file=[pscustomobject]@{Name='Planning 19.10.26 SEMAINE A.xls';Extension='.xls';FullName='C:\planning.xls'}
          $hash='a'*64
          $result=Upload-Candidate $cfg 'jeton-test' $file $hash $device
          if ($result.status -ne 'already_staged') { throw 'Doublon non reconnu' }
          if ($script:uploadCalls -ne 0) { throw 'Fichier existant inutilement re-uploade' }
          $script:exists=$false
          try {
            $null=Upload-Candidate $cfg 'jeton-test' $file $hash $device
            throw 'Nouvel objet : erreur attendue en absence du vrai stockage'
          } catch {
            if ($_.Exception.Message -eq 'Nouvel objet : erreur attendue en absence du vrai stockage') { throw }
          }
          if ($script:uploadCalls -ne 1) { throw 'L envoi d un fichier inexistant est absent' }
          Write-Host 'Pre-verification doublon : OK ; envoi nouveau fichier : OK.'
      - name: Installer Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) {throw "Inno Setup indisponible"}
      - name: Compiler la version compatible avec correctif des chemins PowerShell
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {$compiler="$env:ProgramFiles\Inno Setup 6\ISCC.exe"}
          if (-not (Test-Path $compiler)) {throw 'Compilateur absent'}
          & $compiler 'tools\nethor-sync\NethorSync2.iss'
          if ($LASTEXITCODE -ne 0) {throw 'Compilation échouée'}
          $original='build\installer\NethorSync2-Setup.exe'
          $result='build\installer\NethorSync2-Setup-Compatibility-214.exe'
          if (-not (Test-Path $original)) {throw 'Exécutable absent'}
          Copy-Item $original $result -Force
          $publicName='build\installer\NethorSync-Setup.exe'
          Copy-Item $result $publicName -Force
          $hashCompat=(Get-FileHash -Algorithm SHA256 $result).Hash
          $hashPublic=(Get-FileHash -Algorithm SHA256 $publicName).Hash
          if ($hashCompat -ne $hashPublic) { throw 'La version publique diffère de la version validée' }
          Get-FileHash -Algorithm SHA256 $publicName | Format-List
      - name: Test présence du fichier EXE
        shell: pwsh
        run: |
          $file=Get-Item 'build\installer\NethorSync2-Setup-Compatibility-214.exe'
          if ($file.Length -lt 100000) { throw 'Taille de fichier incohérente' }
      - name: Joindre l exécutable à GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NethorSync2-Compatibility-214
          path: |
            build/installer/NethorSync2-Setup-Compatibility-214.exe
            build/installer/NethorSync-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Joindre la variante à la release NethorSync existante
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag='nethor-sync2-latest'
          $exe='build/installer/NethorSync2-Setup-Compatibility-214.exe'
          $public='build/installer/NethorSync-Setup.exe'
          gh release view $tag --repo $env:GH_REPO --json tagName
          if ($LASTEXITCODE -ne 0) {throw 'Release NethorSync existante introuvable'}
          gh release upload $tag $exe $public --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) {throw 'Impossible de publier le téléchargement NethorSync'}
          gh release view $tag --repo $env:GH_REPO --json assets --jq '.assets[] | select(.name=="NethorSync2-Setup-Compatibility-214.exe" or .name=="NethorSync-Setup.exe") | .name'
