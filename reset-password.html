<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101f3e">
<meta name="description" content="Réinitialisation sécurisée du mot de passe Nethor">
<title>Nethor · Réinitialiser le mot de passe</title>
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{min-height:100dvh;margin:0;background:linear-gradient(160deg,#101f3e 0,#1c3a6c 42%,#f3f6fc 42%);color:#263d5d}
main{max-width:440px;margin:0 auto;padding:calc(50px + env(safe-area-inset-top)) 16px 35px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:23px;color:#fff;font-weight:850;letter-spacing:1.2px;font-size:22px}
.brand img{width:42px;height:42px;border-radius:11px}
.card{background:#fff;border-radius:20px;box-shadow:0 18px 55px #0b193533;padding:26px 23px}
h1{font-size:23px;line-height:1.2;margin:0 0 7px}p{font-size:13px;line-height:1.6;color:#63768e}
form{display:grid;gap:11px;margin-top:18px}label{font-size:12px;font-weight:800}
input{width:100%;padding:13px 12px;border:1px solid #dbe3ee;border-radius:11px;font:inherit;font-size:15px;min-height:47px;outline-offset:2px}
button{width:100%;background:#315fc9;color:#fff;border:0;border-radius:11px;padding:14px 12px;font-size:13px;font-weight:850;min-height:46px;cursor:pointer;margin-top:7px}
button:disabled{opacity:.65;cursor:wait}
a{display:inline-block;margin-top:16px;font-size:12px;font-weight:750;color:#315fc9;text-decoration:none}
#message{font-size:12px;line-height:1.55;margin-top:16px;padding:12px;border-radius:9px;background:#edf3ff;color:#30568b}
#message[data-kind="error"]{background:#fff0ed;color:#973b39}
#message[data-kind="success"]{background:#e9f7ee;color:#23764b}
[hidden]{display:none!important}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script type="module" src="./src/auth/password-recovery-page.js"></script>
</head>
<body>
<main>
  <div class="brand"><img src="./assets/icon.svg" alt="">NETHOR</div>
  <section class="card" aria-label="Nouveau mot de passe">
    <h1>Réinitialiser le mot de passe</h1>
    <p>Choisis un nouveau mot de passe pour ton compte Nethor. Ce lien est personnel et à usage unique.</p>
    <p id="message" role="status" aria-live="polite">Vérification du lien sécurisé…</p>
    <form id="resetForm" hidden autocomplete="off">
      <label for="newPassword">Nouveau mot de passe</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <button id="resetSubmit" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>
    <a href="./index.html">Retour à Nethor</a>
  </section>
</main>
</body>
</html>
